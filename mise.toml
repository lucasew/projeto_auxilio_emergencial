[tools]
"github:lucasew/workspaced" = "0.2.2"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]

[tasks."test:dummy"]
hide = true
run = "echo 'No tests configured'"

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:dummy"]
hide = true
run = "echo 'No codegen configured'"

[tasks.install]
depends = ["install:*"]

[tasks."install:dummy"]
hide = true
run = "echo 'No install configured'"

[tasks.ci]
depends = ["lint", "test"]
